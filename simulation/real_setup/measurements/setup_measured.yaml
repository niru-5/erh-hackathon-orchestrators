# Structured real-setup measurements: what the sim builder reads. Sources: measurements.yaml (raw notes), ../layout.drawio,
# the photos, and follow-up messages. Units: mm, g, degrees. `null` = still needed. `# ?` = assumed/derived, please confirm.
# Last updated 2026-11-12.

# Layout frame (from layout.drawio): origin (0,0) = the table corner at the robot's edge, bottom-left in the drawing.
# +x runs along the robot's table edge (420 mm side), +y runs away from the robot (600 mm side), +z up from the table top.
# The drawing is NOT to scale, only its labels count.
frame: {origin: table corner at the robot's edge, x_along_mm: 420, y_away_mm: 600, z: up from the table top}

table:                              # the part the follower is on
  height_mm: 750                    # floor to top surface
  width_mm: 420                     # along x
  length_mm: 600                    # along y
  surface: glossy woodgrain laminate  # strong specular reflections in the photos
  corner_radius_mm: null            # far corners are rounded in the photos
  seam_to_leader_table_mm: null     # gap to the leader's table on the right side in the photos

robot_base:
  mount: C-clamped on the table edge, base center at y = 0
  center_x_mm: 175                  # ? aligned with the board's center in x (board outer x 85..265). You wrote "aligns with the board": confirm the number
  center_y_mm: 0
  facing: +y                        # arm points along +y toward the board
  footprint_width_mm: 158           # x-extent in the layout
  footprint_depth_mm: null          # y-extent (not needed to place it; needed for the clamp/collision)
  base_plate_height_mm: null        # thickness above the table top
  pan_axis_offset_from_base_center_mm: null   # from the URDF in A2; verify against the real base

board:
  fixed_in_place: true              # does not move between sessions
  outer: {x_mm: [85, 265], y_mm: [175, 360], width_mm: 180, depth_mm: 185}   # layout labels
  top_height_mm: 22.1               # table to playing surface (replaces 22.4 and 20)
  square_mm: 18.1                   # measured; 144.6 / 8 = 18.075 is used for the sim pitch
  playing_area_mm: 144.6
  border_mm: 15                     # layout label
  inlay_mm: {x: 1.8, y: 2.3}        # ? light inlay line between the border and the squares (your "small layout"): assumed this meaning
  # Playing-area placement, derived (assumes x symmetric; the extra y depth is on the robot side, where the clasp is):
  playing_area_xy_mm:               # ? derived, please confirm with a measured outer-edge-to-first-square distance on the robot side
    x: [102.7, 247.3]               # (180 - 144.6) / 2 = 17.7 per side (15 + 1.8 = 16.8 measured, 0.9 mm unaccounted)
    y: [198.1, 342.7]               # far side 15 + 2.3 = 17.3, robot side = 185 - 144.6 - 17.3 = 23.1
  fold_seam: {runs_along: x, position: middle, gap_or_step_mm: null}   # hinge line across the middle in the photos
  clasp_side: robot side            # ? brass clasp faces the robot in the photos

board_frame:                        # chosen convention
  a1: the playing-area corner closest to the origin (0,0)
  ranks_numbers_along: +x           # rank 1..8 increase with x
  files_letters_along: +y           # file a..h increase with y
  square_center_xy_mm: "x = 102.7 + (rank - 0.5) * 18.075 ;  y = 198.1 + (file_index + 0.5) * 18.075   # file a = 1"
  a1_center_xy_mm: [111.7, 207.1]
  h8_center_xy_mm: [238.3, 333.7]

pieces:                             # both colors together; per piece = total / count
  - {type: pawn,   count_weighed: 10, total_mass_g: 13,  mass_g: 1.3}
  - {type: knight, count_weighed: 4,  total_mass_g: 7.5, mass_g: 1.875}
  - {type: bishop, count_weighed: 4,  total_mass_g: 7,   mass_g: 1.75}
  - {type: rook,   count_weighed: 4,  total_mass_g: 7,   mass_g: 1.75}
  - {type: queen,  count_weighed: 2,  total_mass_g: 4,   mass_g: 2.0}
  - {type: king,   count_weighed: 2,  total_mass_g: 5,   mass_g: 2.5}
  # NEEDED per type: height_mm, base_diameter_mm, neck_diameter_mm, widest_diameter_mm; material; weighted base?; matte or glossy.
  # Very light pieces (1.3 to 2.5 g): the sim needs careful contact settings, and the real gripper force matters a lot.

cameras:
  side:
    position_xy_z_mm: [500, 400, 360]   # x = 50 cm, y = 40 cm, z = 36 cm in the layout frame
    note: x = 500 is beyond the table's right edge (table x only reaches 420), i.e. over the leader side, maybe on the gooseneck stand? # ? confirm
    orientation: null                   # NEEDED: from the extrinsic calibration (B3); until then assume it looks at the board center
    intrinsics: null                    # B3
  wrist: {mount: SO-101 wrist camera mount, model: null, intrinsics: null, extrinsics: null}   # B3

lights:
  - {name: gooseneck lamp, location: clamped on the right-hand table edge (leader side)}
  - {name: window/daylight, location: behind and left of the robot (bicycle and window in the photos)}
  # NEEDED: lighting photos with the lamp on/off, time of day, ceiling light.
