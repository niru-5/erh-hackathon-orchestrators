# Template: copy values into measurements.yaml (or tell me where they are). Units: mm, g, degrees. null = not measured yet.
table:
  height_mm: 750
  top_length_mm: 600        # part the follower is on
  top_width_mm: 420
  surface: glossy woodgrain laminate (reflective)
  corner_radius_mm: null
  gap_to_next_table_mm: null    # the seam to the leader's table
robot_base:
  mounting: C-clamps near one table edge
  base_plate_height_mm: null     # thickness of the base above the table top
  dist_pan_axis_to_near_table_edge_mm: null   # the edge the clamps are on
  dist_pan_axis_to_left_table_edge_mm: null
  facing: null                   # which table edge/direction the arm points at rest
board:
  outer_length_mm: null          # whole wooden box, edge to edge
  outer_width_mm: null
  border_width_mm: null          # wood border between box edge and playing area
  playing_area_mm: 144.6
  square_mm: 18.1
  top_height_mm: 22.4            # table to playing surface
  fold_seam: {position: null, step_or_gap_mm: null}   # hinge line across the middle
  a1_corner: null                # which physical corner is a1 (which side white plays from)
  is_fixed_in_place: null        # taped? same spot between sessions?
board_to_base:                   # most important block
  # robot pan axis (center of the rotating base), measured on the table top, as seen from above
  pan_axis_to_a1_corner: {along_robot_forward_mm: null, sideways_mm: null}
  pan_axis_to_board_nearest_edge_mm: null
  board_rotation_vs_robot_forward_deg: null
pieces:                          # per type; counts are for both colors
  pawn:   {count: null, mass_g: 13,  height_mm: null, base_diameter_mm: null}
  rook:   {count: 4, mass_g: null, height_mm: null, base_diameter_mm: null}
  knight: {count: 4, mass_g: 7.5,  height_mm: null, base_diameter_mm: null}
  bishop: {count: 4, mass_g: 7,    height_mm: null, base_diameter_mm: null}
  queen:  {count: 2, mass_g: 4,    height_mm: null, base_diameter_mm: null}
  king:   {count: 2, mass_g: 5,    height_mm: null, base_diameter_mm: null}
  material: null                 # wood? plastic? weighted base?
cameras:
  side: {mount: null, position_desc: null}
  wrist: {mount: SO-101 wrist camera mount, model: null}
lights:
  - {name: gooseneck lamp, on_table_edge: true, notes: "clamped at the right table edge; on/off in each lighting photo?"}
  - {name: window, notes: "direction relative to the robot; time of day"}
