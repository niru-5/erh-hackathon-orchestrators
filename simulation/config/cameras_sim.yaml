# Simulated cameras. Frames: world = layout frame (origin at table corner on the robot's edge,
# +x along that edge, +y away from robot, z up from the table top), metres.
# Intrinsics are NOT stored here: they are read from the calibration.yaml named below.
# Every pose number says where it came from and whether it is PROVISIONAL.

side:
  calibration: real_setup/cameras/side/calibration.yaml   # relative to simulation/
  # Logitech C920, manual focus 20 (see cameras.yaml focus lock), calibrated at 1280x720.
  position_m: [0.5363, 0.3211, 0.3430]
  position_source: >
    SOLVED 2026-11-12 with cv2.solvePnP (IPPE) on the 7x7 inner corners of the real board in
    real_setup/cameras/side/20261112_205932/img_001.png (undistorted with the calibration; 1.58 px rms).
    It agrees with the position the user measured (500, 400, 360 mm) to within (36, -79, -17) mm, so the x origin
    (beyond the table's right edge) is confirmed. The solve assumes the board playing area at the layout position
    (x 102.7..247.3, y 198.1..342.7 mm, top z 22.1 mm); if the board is really elsewhere on the table, the
    world pose shifts with it (the camera-to-board relation is what is measured).
  orientation:
    mode: xyaxes_cv            # explicit rotation, columns = OpenCV camera x(right), y(down), z(forward) in the world frame
    R_cv: [[-0.0739, 0.512537, -0.855479], [0.98662, -0.087429, -0.137609], [-0.145323, -0.854202, -0.499219]]
    source: "solvePnP on the real board corners (see position_source); script simulation/tools/solve_side_pose.py"
  provisional: false
  needs: >
    Check the board's true position on the table (top-down photos suggested it may be 25-35 mm off the layout
    drawing); a measured board position would fix the world pose exactly.

wrist:
  calibration: real_setup/cameras/wrist/calibration.yaml
  # Kalibr-style radtan4 fit, rms 1.16 px (worse than the side fit); cy=414 is well below image centre.
  parent_body: gripper       # of simulation/assets/so101/so101.xml
  # CAD mode: the camera module sits where the upstream SO-ARM100 model puts it (mount + camera bodies in the
  # gripper frame, see cameras.py MOUNT_*/CAM_*); optical axis = lens axis of the module (+z of the camera STL).
  mode: cad
  lens_z_m: 0.0245           # optical centre along the lens barrel from the module origin (barrel front is at 26.3 mm)
  roll_deg: 0.0              # image roll about the optical axis; chosen so the jaw tips appear at the bottom centre like the real frames
  # (ignored in CAD mode) legacy hand-placed pose
  position_m: [0.0, -0.045, -0.030]
  look_at_m: [-0.0079, 0.0, -0.098]
  up_gripper: [1.0, 0.0, 0.0]
  rotation_cv_override: null
  source: >
    Upstream mount/camera placement (so101_new_calib_camera.xml) + lens axis from the camera STL. The roll and the
    optical-centre depth are fitted by eye against real wrist frames (jaws visible at the bottom centre).
  provisional: true
  needs: hand-eye calibration (TODO B3) to verify the gripper-to-camera transform.
  show_mount_visual: true

native_size: [1280, 720]
